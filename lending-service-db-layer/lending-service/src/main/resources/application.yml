spring:
  application:
    name: lending-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lending}
    username: ${DB_USER:lending_app}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      # NEVER 'update' or 'create' beyond local sandbox experiments — Flyway
      # owns schema evolution. 'validate' catches entity/schema drift early.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: info

spring:
  application:
    name: lending-lcm-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lending}
    username: ${DB_USER:lending}
    password: ${DB_PASSWORD:lending}
    hikari:
      # Every connection runs with search_path = lcm, so repositories use unqualified table names.
      schema: ${LCM_DB_SCHEMA:lcm}
      maximum-pool-size: ${LCM_DB_POOL_SIZE:20}
  flyway:
    schemas: ${LCM_DB_SCHEMA:lcm}
    default-schema: ${LCM_DB_SCHEMA:lcm}
    create-schemas: true
    table: lcm_schema_history
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Service-to-service credential (HTTP Basic). Lending-service and the admin portal send it.
# Replace with the IAM JWT resource server when lending-iam-service is integrated: only
# config/SecurityConfig changes; the X-Actor header is then taken from the token subject.
lcm:
  security:
    username: ${LCM_SERVICE_USERNAME:lcm-service}
    password: ${LCM_SERVICE_PASSWORD:changeme}
  # Reject drawdowns that breach a limit. Callers can still send enforce=false per request (shadow mode).
  enforce: ${LCM_ENFORCE:true}
  maker-checker:
    enforce: ${LCM_MAKER_CHECKER_ENFORCE:true}
  reservation:
    default-ttl-minutes: ${LCM_RESERVATION_TTL_MINUTES:30}
    max-ttl-minutes: ${LCM_RESERVATION_MAX_TTL_MINUTES:1440}
  monitoring:
    # Background sweep (expire reservations, expire facilities, raise and close breaches), Spring cron syntax.
    # Set LCM_SWEEP_CRON to "-" to disable the timer; the sweep is always available via POST /api/v1/lcm/monitoring/sweep.
    sweep-cron: ${LCM_SWEEP_CRON:0 * * * * *}
  events:
    max-page-size: 500

spring:
  application:
    name: lending-chit-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lending}
    username: ${DB_USER:lending}
    password: ${DB_PASSWORD:lending}
    hikari:
      # Every connection runs with search_path = chit, so repositories use unqualified table names.
      schema: ${CHIT_DB_SCHEMA:chit}
      maximum-pool-size: ${CHIT_DB_POOL_SIZE:20}
  flyway:
    schemas: ${CHIT_DB_SCHEMA:chit}
    default-schema: ${CHIT_DB_SCHEMA:chit}
    create-schemas: true
    table: chit_schema_history
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Service-to-service credential (HTTP Basic). Lending-service and the admin portal send it.
# Replace with the IAM JWT resource server when lending-iam-service is integrated: only
# config/SecurityConfig changes; the X-Actor header is then taken from the token subject.
chit:
  security:
    username: ${CHIT_SERVICE_USERNAME:chit-service}
    password: ${CHIT_SERVICE_PASSWORD:changeme}
  maker-checker:
    enforce: ${CHIT_MAKER_CHECKER_ENFORCE:true}
  events:
    max-page-size: 500
  # Start-from-scratch (POST /api/v1/chit/maintenance/clear-data). Off unless you turn it on, so a production
  # deployment cannot be emptied by accident. The admin console's Maintenance screen needs it on here as well as on
  # the other services.
  maintenance:
    reset-enabled: ${CHIT_RESET_ENABLED:false}

  # lending-service owns the business date and the working-day calendar (read only). The URL is the lending-service base
  # URL. Username and password are for when lending-service is protected; leave them empty while it is open.
  # The read timeout is long on purpose: a free-plan lending-service can take over a minute to wake up.
  platform:
    lending-url: ${LENDING_SERVICE_URL:http://localhost:8080}
    username: ${CHIT_PLATFORM_USERNAME:}
    password: ${CHIT_PLATFORM_PASSWORD:}
    connect-timeout-ms: ${CHIT_PLATFORM_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${CHIT_PLATFORM_READ_TIMEOUT_MS:90000}
    retries: ${CHIT_PLATFORM_RETRIES:1}
  enrolment:
    # Does a ticket that withdraws before the group starts get its enrolment and registration fees back? Its deposit
    # always comes back. Cancelling the whole group always refunds everything.
    withdrawal-refunds-fees: ${CHIT_WITHDRAWAL_REFUNDS_FEES:false}

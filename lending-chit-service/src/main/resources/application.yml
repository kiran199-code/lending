spring:
  application:
    name: lending-chit-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lending}
    username: ${DB_USER:lending}
    password: ${DB_PASSWORD:lending}
    hikari:
      # Every connection runs with search_path = chit, so repositories use unqualified table names.
      schema: ${CHIT_DB_SCHEMA:chit}
      maximum-pool-size: ${CHIT_DB_POOL_SIZE:20}
  flyway:
    schemas: ${CHIT_DB_SCHEMA:chit}
    default-schema: ${CHIT_DB_SCHEMA:chit}
    create-schemas: true
    table: chit_schema_history
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Service-to-service credential (HTTP Basic). Lending-service and the admin portal send it.
# Replace with the IAM JWT resource server when lending-iam-service is integrated: only
# config/SecurityConfig changes; the X-Actor header is then taken from the token subject.
chit:
  security:
    username: ${CHIT_SERVICE_USERNAME:chit-service}
    password: ${CHIT_SERVICE_PASSWORD:changeme}
  maker-checker:
    enforce: ${CHIT_MAKER_CHECKER_ENFORCE:true}
  events:
    max-page-size: 500
  # Start-from-scratch (POST /api/v1/chit/maintenance/clear-data). Off unless you turn it on, so a production
  # deployment cannot be emptied by accident. The admin console's Maintenance screen needs it on here as well as on
  # the other services.
  maintenance:
    reset-enabled: ${CHIT_RESET_ENABLED:false}

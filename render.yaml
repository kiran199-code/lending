# Render Blueprint: one free Postgres + the two Spring Boot services, all in one region so the
# services reach the database over Render's private network.
#
# Free-tier trade-offs (this is a try-it setup, not production):
#  - Free web services sleep after ~15 min idle (first request wakes them in ~1 min), so the
#    batch service's Quartz schedules will not fire while it is asleep.
#  - Free Postgres is deleted 30 days after creation unless upgraded.
#  - No Kafka on Render: the batch service's job-completion events are simply dropped
#    (logged as errors, jobs themselves are unaffected).
#  - 512 MB RAM per service: JVM heap is capped explicitly below.
databases:
  - name: lending-db
    plan: free
    region: singapore
    databaseName: lending
    user: lending_app
    ipAllowList: []   # private network only

services:
  - type: web
    name: lending-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./lending-service-db-layer/lending-service/Dockerfile
    dockerContext: ./lending-service-db-layer/lending-service
    healthCheckPath: /v3/api-docs
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: DB_HOST
        fromDatabase: { name: lending-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: lending-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: lending-db, property: database }
      - key: DB_USER
        fromDatabase: { name: lending-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: lending-db, property: password }
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      # Sandbox only: lets the admin portal's Maintenance screen clear all data and start again.
      # Remove it (or set "false") on anything that holds data you want to keep.
      - key: LENDING_RESET_ENABLED
        value: "true"
      # Limits (LCM). Leave the mode "off" until lending-lcm-service is deployed and loaded, then "shadow", then "live".
      - key: LENDING_LCM_MODE
        value: "off"
      # lending-lcm-service's public URL (Render dashboard > lending-lcm-service); set after the first sync.
      - key: LENDING_LCM_URL
        sync: false
      - key: LENDING_LCM_USERNAME
        value: lcm-service
      - key: LENDING_LCM_PASSWORD
        fromService:
          type: web
          name: lending-lcm-service
          envVarKey: LCM_SERVICE_PASSWORD
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  - type: web
    name: lending-batch-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./lending-batch-service/Dockerfile
    dockerContext: ./lending-batch-service
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "10000"
      - key: DB_HOST
        fromDatabase: { name: lending-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: lending-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: lending-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: lending-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: lending-db, property: password }
      # Batch needs far more connections than the other services: Quartz (clustered JDBC store),
      # Spring Batch metadata writes, and one connection per running job/partition thread.
      # 5 exhausted the pool (see CHANGELOG 2026-10-11). Free Postgres allows ~97 connections in total.
      - key: DB_POOL_SIZE
        value: "20"
      - key: DB_POOL_MIN_IDLE
        value: "4"
      # Fewer Quartz workers so a burst of same-minute cron triggers queues instead of
      # all grabbing connections at once.
      - key: QUARTZ_THREAD_COUNT
        value: "3"
      # Swagger UI at /swagger-ui.html (behind the batch-admin Basic login).
      - key: BATCH_SWAGGER_ENABLED
        value: "true"
      # No broker on this setup: Kafka publishing is switched off, so no producer is created and the logs stay quiet.
      - key: BATCH_KAFKA_ENABLED
        value: "false"
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: "localhost:9092"
      - key: BATCH_KAFKA_MAX_BLOCK_MS
        value: "1000"
      - key: BATCH_ADMIN_USERNAME
        value: batch-admin
      - key: BATCH_ADMIN_PASSWORD
        generateValue: true   # read it in the Render dashboard -> Environment
      # Batch jobs call lending-service's REST API for every change to loan data.
      # Required: the prod profile refuses to start without it.
      - key: LENDING_SERVICE_URL
        value: https://lending-service-5tqm.onrender.com
      # Nightly end of day (runs the DAILY jobs for the business date, then advances it). The service
      # sleeps on the free tier, so the cron may be missed; POST /api/v1/batch-admin/eod/run does it on demand.
      - key: BATCH_EOD_ENABLED
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  - type: web
    name: lending-admin-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./lending-admin-service/Dockerfile
    dockerContext: ./lending-admin-service
    healthCheckPath: /actuator/health
    envVars:
      - key: LCM_SERVICE_URL
        sync: false             # https://lending-lcm-service-XXXX.onrender.com (enables the Limits & collateral screens)
      - key: LCM_SERVICE_USERNAME
        value: lcm-service
      - key: LCM_SERVICE_PASSWORD
        fromService: { type: web, name: lending-lcm-service, envVarKey: LCM_SERVICE_PASSWORD }
      - key: SERVER_PORT
        value: "10000"
      - key: DB_HOST
        fromDatabase: { name: lending-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: lending-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: lending-db, property: database }
      - key: DB_USER
        fromDatabase: { name: lending-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: lending-db, property: password }
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true   # read it in the Render dashboard -> Environment
      # Enables "Download statement" on the account page.
      - key: LENDING_SERVICE_URL
        value: https://lending-service-5tqm.onrender.com
      # Enables editing batch job settings on the Configuration screen. Set BATCH_SERVICE_URL to
      # lending-batch-service's public URL (Render dashboard > lending-batch-service); until then the screen is view-only.
      - key: BATCH_SERVICE_URL
        sync: false
      - key: BATCH_ADMIN_USERNAME
        value: batch-admin
      - key: BATCH_ADMIN_PASSWORD
        fromService:
          type: web
          name: lending-batch-service
          envVarKey: BATCH_ADMIN_PASSWORD
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  - type: web
    name: lending-lcm-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./lending-lcm-service/Dockerfile
    dockerContext: ./lending-lcm-service
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_HOST
        fromDatabase: { name: lending-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: lending-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: lending-db, property: database }
      - key: DB_USER
        fromDatabase: { name: lending-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: lending-db, property: password }
      - key: LCM_DB_SCHEMA
        value: lcm
      - key: LCM_SERVICE_USERNAME
        value: lcm-service
      - key: LCM_SERVICE_PASSWORD
        generateValue: true   # lending-service reads it from here (LENDING_LCM_PASSWORD below)
      - key: LCM_ENFORCE
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  - type: web
    name: lending-iam-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./lending-iam-service/Dockerfile
    dockerContext: ./lending-iam-service
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_HOST
        fromDatabase: { name: lending-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: lending-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: lending-db, property: database }
      - key: DB_USER
        fromDatabase: { name: lending-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: lending-db, property: password }
      - key: IAM_DB_SCHEMA
        value: iam
      # Required. Base64 of 32 bytes. If Render's generated value is not accepted, replace it with the output of
      # `openssl rand -base64 32` (mark it sync: false) and KEEP A COPY OUTSIDE RENDER: losing it makes every stored secret unreadable.
      - key: IAM_ENCRYPTION_KEY
        generateValue: true
      # The service's own public URL, https://lending-iam-service-XXXX.onrender.com (no trailing slash). It becomes the
      # token issuer, so set it after the first sync and before the first token is issued.
      - key: IAM_ISSUER
        sync: false
      # First start only (creates the bootstrap administrator). Remove once two named administrators exist.
      - key: IAM_BOOTSTRAP_USERNAME
        value: bootstrap
      - key: IAM_BOOTSTRAP_PASSWORD
        sync: false
      # Browser origins allowed to call the API (the admin portal's URL once it uses IAM).
      - key: IAM_CORS_ORIGINS
        sync: false
      - key: IAM_BCRYPT_COST
        value: "10"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx300m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  # End-to-end lifecycle test suite (lending-e2e-test-service), hosted so runs need no local machine.
  # Open its URL, paste E2E_SERVER_TOKEN (Environment tab), press Dry run, then Run. See
  # lending-e2e-test-service/README.md "Hosting the suite on Render". It only ever talks to *.onrender.com hosts
  # and refuses production-looking names. After the first sync set the two URLs marked sync:false.
  - type: web
    name: lending-e2e-test
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./lending-e2e-test-service/Dockerfile
    dockerContext: ./lending-e2e-test-service
    healthCheckPath: /health
    envVars:
      - key: E2E_PROFILE
        value: dev
      - key: E2E_ENV_NAME
        value: render-sandbox
      - key: E2E_GUARD_ALLOWED_HOST_PATTERNS
        value: '\.onrender\.com$'
      - key: E2E_LENDING_BASE_URL
        value: https://lending-service-5tqm.onrender.com
      - key: E2E_BATCH_BASE_URL
        sync: false   # public URL of lending-batch-service
      - key: E2E_ADMIN_BASE_URL
        sync: false   # public URL of lending-admin-service
      - key: E2E_BATCH_USERNAME
        value: batch-admin
      - key: E2E_BATCH_PASSWORD
        fromService:
          type: web
          name: lending-batch-service
          envVarKey: BATCH_ADMIN_PASSWORD
      - key: E2E_ADMIN_USERNAME
        value: admin
      - key: E2E_ADMIN_PASSWORD
        fromService:
          type: web
          name: lending-admin-service
          envVarKey: ADMIN_PASSWORD
      - key: E2E_SERVER_BIND
        value: 0.0.0.0
      - key: E2E_SERVER_TOKEN
        generateValue: true   # read it in the Render dashboard -> Environment; paste it into the console page
      - key: E2E_HTTP_REQUEST_TIMEOUT_SECONDS
        value: "120"
      - key: E2E_HTTP_RETRIES
        value: "5"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

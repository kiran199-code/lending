spring:
  application:
    name: lending-service

  datasource:
    # DB_URL wins if set; otherwise composed from DB_HOST/DB_PORT/DB_NAME (used by PaaS hosts such
    # as Render that hand out host/port/name separately instead of a JDBC URL).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lending}}
    username: ${DB_USER:lending_app}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

  jpa:
    hibernate:
      # NEVER 'update' or 'create' beyond local sandbox experiments — Flyway
      # owns schema evolution. 'validate' catches entity/schema drift early.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

# The platform business date (see BusinessDateService). Transactions are dated by it, not the clock.
business-date:
  # Days that are never working days; bank holidays are kept in the non_working_day table.
  weekend-days: ${BUSINESS_DATE_WEEKEND_DAYS:SATURDAY,SUNDAY}
  # Reject value dates / as-of dates after the business date. Leave on except for throwaway local work.
  enforce-no-future-dates: ${BUSINESS_DATE_ENFORCE_NO_FUTURE:true}
  # Allow PUT /api/v1/business-date to move the date backwards (testing only; accruals already
  # posted for later dates are NOT undone).
  allow-backward-set: ${BUSINESS_DATE_ALLOW_BACKWARD_SET:false}
  # Only used to report systemDate next to the business date.
  system-timezone: ${BUSINESS_DATE_SYSTEM_TIMEZONE:Asia/Kolkata}

# Start-from-scratch operations (POST /api/v1/maintenance/clear-data). Off unless you turn it on, so a
# production deployment cannot be emptied by accident. Creating the base products is always allowed.
lending:
  maintenance:
    reset-enabled: ${LENDING_RESET_ENABLED:false}
  # Link to the separate Limits and Collateral Management service (lending-lcm-service).
  # mode: off (default - no calls, no behaviour change) | shadow (record usage in LCM, never block) | live (enforce limits)
  lcm:
    mode: ${LENDING_LCM_MODE:off}
    base-url: ${LENDING_LCM_URL:http://localhost:8084}
    username: ${LENDING_LCM_USERNAME:lcm-service}
    password: ${LENDING_LCM_PASSWORD:changeme}
    connect-timeout-ms: ${LENDING_LCM_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${LENDING_LCM_READ_TIMEOUT_MS:5000}
    retries: ${LENDING_LCM_RETRIES:2}
    fail-open: ${LENDING_LCM_FAIL_OPEN:false}
    reservation-ttl-minutes: ${LENDING_LCM_RESERVATION_TTL_MINUTES:30}
    outbox:
      batch-size: 50
      max-attempts: 10
      lease-minutes: 5
      retry-cron: "0 * * * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: info   # set to debug to see every statement (very noisy)
    org.flywaydb: info

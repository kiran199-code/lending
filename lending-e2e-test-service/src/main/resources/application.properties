# ======================================================================================
# lending-e2e-test-service - DEFAULTS. Every value here is a LABELLED DEFAULT, not a rule.
# Override per environment in application-<profile>.properties, an external file (-De2e.config=)
# or env vars (E2E_ACCOUNTS=40). Credentials: environment variables ONLY.
# ======================================================================================
e2e.profile=local
e2e.env.name=local

# ---- production guard (no override switch exists) ----
e2e.guard.allowed-profiles=local,dev,sit,uat
e2e.guard.production-words=prod,prd,live
e2e.guard.production-host-patterns=(^|[.-])prod(uction)?([.-]|$),(^|[.-])prd([.-]|$),(^|[.-])live([.-]|$)
# optional allow-list of hosts (regex, comma separated); empty = not enforced
e2e.guard.allowed-host-patterns=

# ---- targets (set in the profile file or env: E2E_LENDING_BASE_URL ...) ----
e2e.lending.base-url=
e2e.lending.username=
e2e.lending.password=
e2e.batch.base-url=
e2e.batch.username=batch-admin
e2e.batch.password=
e2e.admin.base-url=
e2e.admin.username=admin
e2e.admin.password=

# ---- http behaviour ----
e2e.http.connect-timeout-seconds=15
e2e.http.request-timeout-seconds=90
e2e.http.retries=4
e2e.http.retry-backoff-ms=2000

# ---- population ----
# DEFAULT 20 accounts; cohort A (good) / cohort B (stress) split in percent
e2e.accounts=20
e2e.cohort-a-percent=50
e2e.scenario-file=classpath:scenarios.csv
e2e.seed=42

# ---- simulated calendar ----
# DEFAULT: simulated day 1 is e2e.start-date. Disbursal is "now" on the server but the schedule starts on this date.
e2e.start-date=2026-11-01
# hard stop for the day loop (safety valve)
e2e.max-sim-days=800
# the first instalment falls one repayment period after the start date
e2e.disburse.first-due-in-periods=1
e2e.payment.channel=ONLINE

# ---- identity tagging ----
# test customer/sanction ids = id-base + (run stamp yyMMddHHmm) * 1000 + account index. Run id is derived from the stamp.
e2e.id-base=9000000000000

# ---- batch path (BATCH only by decision; API alternatives are opt-in and flagged in the report) ----
e2e.batch.poll-timeout-seconds=120
e2e.batch.poll-interval-ms=500
e2e.batch.daily-jobs=INTEREST_ACCRUAL_DAILY,PENAL_INTEREST_CALCULATION_DAILY,DPD_UPDATE_DAILY,NPA_CLASSIFICATION_CHECK_DAILY,SOD_EOD_BALANCING_DAILY,GL_POSTING_RECONCILIATION_DAILY
e2e.batch.monthly-jobs=EMI_BILLING_GENERATION_MONTHLY,INTEREST_CAPITALIZATION_MONTHLY,PROVISIONING_CALCULATION_MONTHLY
# DEFAULT BATCH. API = call lending-service directly for accrual / classification (explicit deviation, labelled in report)
e2e.accrual.path=BATCH
e2e.dpd.path=BATCH
# PAY_THEN_EOD: payments for the day post first, then the day's batch jobs run (accrual sees closing balance)
# EOD_THEN_PAY: batch runs first (accrual sees opening balance)
e2e.day.order=PAY_THEN_EOD

# ---- business date (lending-service owns the date; the suite drives it, it never fakes it) ----
# MANAGED (DEFAULT): set the platform business date to e2e.start-date before the run, advance it one day per simulated
#   day through end of day, and verify every screen/figure against it. Needs lending-service with the business-date API.
# OFF: legacy behaviour - the suite only passes dates in requests. lending-service then rejects payments dated after
#   its business date unless it runs with BUSINESS_DATE_ENFORCE_NO_FUTURE=false. Use only against an older build.
e2e.business-date.mode=MANAGED
# EOD_RUN (DEFAULT): POST /api/v1/batch-admin/eod/run - the batch service runs every enabled DAILY job for the date and
#   advances the date itself (the production path). Monthly jobs are still triggered one by one on month end.
# JOBS_THEN_ADVANCE: the suite triggers each configured job one by one (as before) and then calls lending-service's
#   end-of-day start + advance. Needed for e2e.accrual.path=API / e2e.dpd.path=API.
e2e.eod.mode=EOD_RUN
e2e.eod.poll-timeout-seconds=900

# ---- classification model the suite checks against (DEFAULT = what lending-service hard-codes today) ----
# "<status>:<max days past due>" in ascending order; the last entry has no limit
e2e.dpd.buckets=ACTIVE:0,NPA_SMA0:30,NPA_SMA1:60,NPA_SMA2:90,NPA_SUBSTANDARD:365,NPA_DOUBTFUL:1095,NPA_LOSS:max
# DEFAULT: NPA is 91+ DPD (RBI IRAC norm). Used only for scenario narrative / report, not for any assertion on production thresholds.
e2e.dpd.npa-from-days=91

# ---- tolerances ----
e2e.tolerance.money=0.05
e2e.tolerance.accrual-daily=0.01
e2e.tolerance.close-balance=0.05

# ---- checks switched on/off ----
e2e.check.idempotency-replay=true
e2e.check.batch-rerun-idempotency=true
# admin portal days-past-due must follow the platform business date (key name kept for compatibility)
e2e.check.admin-dpd-wallclock=true

# ---- output ----
e2e.output-dir=results
e2e.dry-run=false
# fail the process (exit code 1) when any check with severity >= this level fails: CRITICAL,HIGH,MEDIUM,LOW,NONE
e2e.fail-on-severity=HIGH
# true = a NOT FOUND capability also turns the exit code red (default false: gaps are reported in defects.md, only FAILs gate a pipeline)
e2e.fail-on-not-found=false

# ---- terminal account statuses (closed accounts take no further payments / accruals) ----
e2e.status.terminal=CLOSED,FORECLOSED,WRITTEN_OFF
e2e.status.closed-ok=CLOSED,FORECLOSED
# status of a schedule row that is settled
e2e.verify.every-n-days=1
# partial payment attempt = this fraction of the instalment due (scenario SHORT_PAY_THEN_PAY)
e2e.short-pay.fraction=0.5
# accrued-vs-paid interest reconciliation at closure: allowed relative gap in percent
e2e.tolerance.accrual-vs-paid-pct=2.0
# ledger outbox: max pages of 200 rows read at the end of the run
e2e.ledger.max-pages=20
# API-surface probes (OpenAPI documents) used to decide NOT FOUND for capabilities
e2e.probe.lending-openapi=/v3/api-docs
e2e.probe.admin-openapi=/v3/api-docs
e2e.probe.batch-openapi=/v3/api-docs
# jobs whose zero-record result is a defect when eligible accounts exist
e2e.batch.record-jobs=INTEREST_ACCRUAL_DAILY,DPD_UPDATE_DAILY,NPA_CLASSIFICATION_CHECK_DAILY

# ---- optional REST trigger (serve command) ----
# the PORT environment variable (Render) wins when set
e2e.server.port=8090
e2e.server.bind=127.0.0.1
# required when binding anything but loopback (set via E2E_SERVER_TOKEN)
e2e.server.token=
# teardown foreclosure date; default = today
e2e.teardown.date=
# minutes the hosted server keeps itself awake after a run / teardown so results can be fetched (needs RENDER_EXTERNAL_URL or e2e.server.public-url)
e2e.server.keepalive-minutes=30
e2e.server.public-url=
